apiVersion: v1
kind: Secret
metadata:
  name: n8n-db-secret
  namespace: n8n
type: Opaque
stringData:
  DB_POSTGRESDB_HOST: your-rds-endpoint.rds.amazonaws.com
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n_user
  DB_POSTGRESDB_PASSWORD: replace-with-strong-password
---
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: n8n
type: Opaque
stringData:
  # Use your DNS name after provisioning LoadBalancer/Ingress
  N8N_HOST: n8n.example.com
  WEBHOOK_URL: http://n8n.example.com:5678/
  # Generate once and keep stable, e.g. openssl rand -hex 32
  N8N_ENCRYPTION_KEY: replace-with-64-hex-chars
