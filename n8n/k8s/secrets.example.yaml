apiVersion: v1
kind: Secret
metadata:
  name: n8n-db-secret
  namespace: n8n
type: Opaque
stringData:
  DB_POSTGRESDB_HOST: your-rds-endpoint.rds.amazonaws.com
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n_user
  DB_POSTGRESDB_PASSWORD: replace-with-strong-password
---
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: n8n
type: Opaque
stringData:
  # Must match ingress host (n8n/k8s/ingress.yaml). N8N_PROXY_HOPS and N8N_SECURE_COOKIE
  # are set in k8s/base.yaml for ALB TLS termination.
  N8N_HOST: n8n.levkesha.com
  N8N_EDITOR_BASE_URL: https://n8n.levkesha.com
  WEBHOOK_URL: https://n8n.levkesha.com/
  # Generate once and keep stable, e.g. openssl rand -hex 32
  N8N_ENCRYPTION_KEY: replace-with-64-hex-chars
