name: Deploy claude-router

on:
  push:
    branches: [main]
    paths:
      - "claude-router/**"
      - ".github/workflows/deploy-claude-router.yml"
  workflow_dispatch:

env:
  ECR_REPOSITORY: claude-router
  SERVICE_NAME: claude-router
  K8S_NAMESPACE: dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: claude-router
        run: pip install -r requirements.txt ruff==0.17.0

      - name: Lint
        working-directory: claude-router
        run: ruff check .

      - name: Import check
        working-directory: claude-router
        run: python -c "from app.main import app"

  build-and-push:
    name: Build & Push to ECR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Region and cluster come from platform-infra.dev.json (TF output SSOT).
      - name: Resolve platform config
        run: |
          python3 - <<'PY'
          import json, os, sys
          data = json.load(open("platform-infra.dev.json", encoding="utf-8"))
          missing = [k for k in ("aws_region", "cluster_name") if not data.get(k)]
          if missing:
              print(f"::error::platform-infra.dev.json missing {missing}")
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"AWS_REGION={data['aws_region']}\n")
              env.write(f"EKS_CLUSTER_NAME={data['cluster_name']}\n")
          PY
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-ecr

      # Login prints the registry host. mask-password covers only the docker password.
      # Register the host before that step so build and push logs are masked too.
      - name: Mask registry host
        run: |
          set -euo pipefail
          export AWS_PAGER=""
          if [ -z "${AWS_REGION}" ]; then
            echo "::error::AWS region is empty"
            exit 1
          fi
          err="$(mktemp)"
          if ! account="$(aws sts get-caller-identity --query Account --output text 2>"$err")"; then
            rm -f "$err"
            echo "::error::STS identity lookup failed"
            exit 1
          fi
          rm -f "$err"
          if [ -z "$account" ] || [ "$account" = "None" ]; then
            echo "::error::could not resolve the registry host"
            exit 1
          fi
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "::add-mask::https://${registry}"
          echo "::add-mask::${registry}"
          echo "::add-mask::${account}"

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2
        with:
          mask-password: true

      - name: Build, tag & push image
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./claude-router
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Region and cluster come from platform-infra.dev.json (TF output SSOT).
      - name: Resolve platform config
        run: |
          python3 - <<'PY'
          import json, os, sys
          data = json.load(open("platform-infra.dev.json", encoding="utf-8"))
          missing = [k for k in ("aws_region", "cluster_name") if not data.get(k)]
          if missing:
              print(f"::error::platform-infra.dev.json missing {missing}")
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"AWS_REGION={data['aws_region']}\n")
              env.write(f"EKS_CLUSTER_NAME={data['cluster_name']}\n")
          PY
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-eks

      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3

      - name: Update kubeconfig
        env:
          CLUSTER: ${{ env.EKS_CLUSTER_NAME }}
          REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          err="$(mktemp)"
          if ! aws eks update-kubeconfig \
            --name "$CLUSTER" \
            --region "$REGION" \
            >/dev/null 2>"$err"; then
            rm -f "$err"
            echo "::error::kubeconfig update failed"
            exit 1
          fi
          rm -f "$err"

      # Asleep cluster fails this job, same outcome as LevKesha/cicd reusable-helm-deploy.yml.
      # Soft-downed EKS still answers the API with 0 Ready nodes.
      - name: Count Ready nodes
        id: nodes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ready="$(kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | awk '$0=="True"{n++} END{print n+0}')"
          echo "Ready nodes: ${ready}"
          if [ "${ready}" -eq 0 ] && [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::warning::cluster asleep (0 nodes) - dry-run skipped; manifests not validated"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "${ready}" -eq 0 ]; then
            echo "::error::cluster asleep (0 nodes) - manifests not applied; wake first (infrastructure wake-sleep-dev.yml action=wake) and rerun the deploy"
            echo "cluster asleep (0 nodes) - manifests not applied; wake first (infrastructure wake-sleep-dev.yml action=wake) and rerun the deploy" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure namespace
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.nodes.outputs.deploy == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          NAMESPACE: ${{ env.K8S_NAMESPACE }}
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.nodes.outputs.deploy == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          sed "s/IMAGE_TAG/${IMAGE_TAG}/g" claude-router/k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f claude-router/k8s/service.yaml

      - name: Wait for rollout
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.nodes.outputs.deploy == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          SERVICE: ${{ env.SERVICE_NAME }}
          NAMESPACE: ${{ env.K8S_NAMESPACE }}
        run: |
          kubectl rollout status deployment/"$SERVICE" \
            -n "$NAMESPACE" \
            --timeout=120s
