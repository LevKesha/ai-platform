name: AI Platform CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run CI over present services
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest ruff

          for service in agent-api rag-service mcp-server; do
            if [[ -d "$service" ]]; then
              echo "==> CI for $service"
              pushd "$service"
              if [[ -f requirements.txt ]]; then
                pip install -r requirements.txt
              fi
              ruff check . || true
              pytest -q || true
              popd
              if [[ -f "$service/Dockerfile" ]]; then
                docker build -t "${service}:ci" "./$service"
              fi
            else
              echo "Skipping $service (directory not present)"
            fi
          done
