name: AI Platform CI

on:
  push:
    branches: [dev, main]
    paths:
      - "claude-router/**"
      - "agent-api/**"
      - "rag-service/**"
      - "mcp-server/**"
      - "packages/**"
      - "platform-config.yaml"
      - "scripts/**"
      - "agents/**"
      - "n8n-config/**"
      - "olympus/console-data.js"
      - "olympus/public-data.js"
      - "olympus/chat*"
      - ".github/workflows/ai-platform-ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "claude-router/**"
      - "agent-api/**"
      - "rag-service/**"
      - "mcp-server/**"
      - "packages/**"
      - "platform-config.yaml"
      - "scripts/**"
      - "agents/**"
      - "n8n-config/**"
      - "olympus/console-data.js"
      - "olympus/public-data.js"
      - "olympus/chat*"
      - ".github/workflows/ai-platform-ci.yml"
  workflow_dispatch:

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run CI over present services
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest ruff pyyaml boto3 moto

          for service in agent-api rag-service mcp-server claude-router; do
            if [[ -d "$service" ]]; then
              echo "==> CI for $service"
              pushd "$service"
              if [[ -f requirements.txt ]]; then
                pip install -r requirements.txt
              fi
              ruff check . || true
              pytest -q || true
              popd
              if [[ -f "$service/Dockerfile" ]]; then
                docker build -t "${service}:ci" "./$service"
              fi
            else
              echo "Skipping $service (directory not present)"
            fi
          done

          echo "==> Platform config SSOT"
          python3 scripts/check-platform-config.py
          python3 scripts/sync-platform-common.py --check
          pytest -q packages/tests/test_helper_slot.py packages/chat_helper/tests
          echo "==> Chat panel node tests"
          for test in packages/chat_helper/tests/*.cjs; do
            node "$test"
          done
