name: AI Platform CI

# platform-config-siblings clones the sibling repos that
# scripts/check-platform-config.py reads and runs it with
# PLATFORM_CONFIG_REQUIRE_SIBLINGS=1, so a missing clone fails instead of
# being skipped. It needs the Actions secret SIBLING_REPOS_READ_TOKEN:
# a read-only token (contents: read) scoped to only those sibling repos,
# as a fine-grained personal access token or a GitHub App installation
# token. The token is used only by the checkout steps of that job and is
# never passed to a script. The job fails with "sibling token not
# available" until the secret exists, including for pull requests from
# forks, which do not receive repository secrets.

on:
  push:
    branches: [dev, main]
    paths:
      - "claude-router/**"
      - "agent-api/**"
      - "rag-service/**"
      - "mcp-server/**"
      - "packages/**"
      - "platform-config.yaml"
      - "scripts/**"
      - "agents/**"
      - "n8n-config/**"
      - "olympus/**"
      - ".github/workflows/deploy-olympus.yml"
      - ".github/workflows/ai-platform-ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "claude-router/**"
      - "agent-api/**"
      - "rag-service/**"
      - "mcp-server/**"
      - "packages/**"
      - "platform-config.yaml"
      - "scripts/**"
      - "agents/**"
      - "n8n-config/**"
      - "olympus/**"
      - ".github/workflows/deploy-olympus.yml"
      - ".github/workflows/ai-platform-ci.yml"
  workflow_dispatch:

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Olympus tree has no dotfiles
        run: |
          set -euo pipefail
          bad="$(git ls-files -z -- olympus | tr '\0' '\n' | grep -E '(^|/)\.' || true)"
          if [[ -n "$bad" ]]; then
            while IFS= read -r path; do
              echo "::error file=${path}::dot-prefixed path under olympus/ is not allowed"
            done <<< "$bad"
            exit 1
          fi
          echo "olympus/: no dot-prefixed paths"

      - name: Run CI over present services
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest ruff==0.17.0 pyyaml boto3 moto

          for service in agent-api rag-service mcp-server claude-router; do
            if [[ -d "$service" ]]; then
              echo "==> CI for $service"
              pushd "$service"
              if [[ -f requirements.txt ]]; then
                pip install -r requirements.txt
              fi
              ruff check . || true
              pytest -q || true
              popd
              if [[ -f "$service/Dockerfile" ]]; then
                docker build -t "${service}:ci" "./$service"
              fi
            else
              echo "Skipping $service (directory not present)"
            fi
          done

          echo "==> RAG Lambda deps (hash-locked, no runtime install)"
          python3 -m pip install --require-hashes --target "${RUNNER_TEMP:-/tmp}/chat-rag-deps" -r packages/chat_helper/requirements.txt
          echo "==> Platform config SSOT"
          python3 scripts/check-platform-config.py
          python3 scripts/sync-platform-common.py --check
          pytest -q packages/tests/test_helper_slot.py packages/chat_helper/tests scripts/tests
          echo "==> Chat panel node tests"
          for test in packages/chat_helper/tests/*.cjs; do
            node "$test"
          done

  platform-config-siblings:
    name: Platform config across sibling repos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the sibling read token
        env:
          TOKEN_PRESENT: ${{ secrets.SIBLING_REPOS_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "$TOKEN_PRESENT" != "true" ]]; then
            echo "::error::sibling token not available: set the Actions secret SIBLING_REPOS_READ_TOKEN (fork pull requests do not receive it)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: ai-platform
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agent-api
          token: ${{ secrets.SIBLING_REPOS_READ_TOKEN }}
          persist-credentials: false
          path: siblings/agent-api
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/rag-service
          token: ${{ secrets.SIBLING_REPOS_READ_TOKEN }}
          persist-credentials: false
          path: siblings/rag-service
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/llm-cost
          token: ${{ secrets.SIBLING_REPOS_READ_TOKEN }}
          persist-credentials: false
          path: siblings/llm-cost
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check platform config against sibling repos
        working-directory: ai-platform
        env:
          PLATFORM_CONFIG_SIBLINGS_DIR: ${{ github.workspace }}/siblings
          PLATFORM_CONFIG_REQUIRE_SIBLINGS: "1"
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python3 scripts/check-platform-config.py
