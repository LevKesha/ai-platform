name: AI Platform CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  detect-services:
    name: Detect service folders
    runs-on: ubuntu-latest
    outputs:
      has_agent_api: ${{ steps.detect.outputs.has_agent_api }}
      has_rag_service: ${{ steps.detect.outputs.has_rag_service }}
      has_mcp_server: ${{ steps.detect.outputs.has_mcp_server }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          [[ -d "agent-api" ]] && echo "has_agent_api=true" >> "$GITHUB_OUTPUT" || echo "has_agent_api=false" >> "$GITHUB_OUTPUT"
          [[ -d "rag-service" ]] && echo "has_rag_service=true" >> "$GITHUB_OUTPUT" || echo "has_rag_service=false" >> "$GITHUB_OUTPUT"
          [[ -d "mcp-server" ]] && echo "has_mcp_server=true" >> "$GITHUB_OUTPUT" || echo "has_mcp_server=false" >> "$GITHUB_OUTPUT"

  lint-and-test:
    name: Lint and test (${{ matrix.service }})
    needs: detect-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent-api
            enabled: ${{ needs.detect-services.outputs.has_agent_api }}
          - service: rag-service
            enabled: ${{ needs.detect-services.outputs.has_rag_service }}
          - service: mcp-server
            enabled: ${{ needs.detect-services.outputs.has_mcp_server }}
    if: matrix.enabled == 'true'
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi
          pip install pytest ruff

      - name: Ruff lint
        run: |
          set -euo pipefail
          ruff check .

      - name: Pytest
        run: |
          set -euo pipefail
          pytest -q || pytest -q tests || true

  docker-build-smoke:
    name: Docker build smoke (${{ matrix.service }})
    needs: detect-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent-api
            enabled: ${{ needs.detect-services.outputs.has_agent_api }}
          - service: rag-service
            enabled: ${{ needs.detect-services.outputs.has_rag_service }}
          - service: mcp-server
            enabled: ${{ needs.detect-services.outputs.has_mcp_server }}
    if: matrix.enabled == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t "${{ matrix.service }}:ci" "./${{ matrix.service }}"
