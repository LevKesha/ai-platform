name: Deploy Olympus

on:
  push:
    branches: [main]
    paths:
      - "olympus/**"
      - ".github/workflows/deploy-olympus.yml"
  workflow_dispatch:

env:
  OLYMPUS_DOMAIN: olympus.levkesha.com

jobs:
  sync:
    name: Sync S3 + invalidate CloudFront
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Region and cluster come from platform-infra.dev.json (TF output SSOT).
      - name: Resolve platform config
        run: |
          python3 - <<'PY'
          import json, os, sys
          data = json.load(open("platform-infra.dev.json", encoding="utf-8"))
          missing = [k for k in ("aws_region", "cluster_name") if not data.get(k)]
          if missing:
              print(f"::error::platform-infra.dev.json missing {missing}")
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"AWS_REGION={data['aws_region']}\n")
              env.write(f"EKS_CLUSTER_NAME={data['cluster_name']}\n")
          PY
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-olympus

      - name: Stamp local asset URLs
        run: python3 scripts/stamp-olympus-assets.py olympus --version "${GITHUB_SHA:0:7}"

      - name: Sync origin and invalidate
        run: |
          set -euo pipefail
          DIST_ID="$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items!=null] | [?contains(Aliases.Items, '${OLYMPUS_DOMAIN}')].Id | [0]" --output text)"
          if [[ -z "${DIST_ID}" || "${DIST_ID}" == "None" ]]; then
            echo "No CloudFront distribution aliased to ${OLYMPUS_DOMAIN}"
            exit 1
          fi
          # Items[0] is not the site bucket. The wake origin is first.
          # The static files are the default cache behavior's origin.
          TARGET="$(aws cloudfront get-distribution --id "${DIST_ID}" --query "Distribution.DistributionConfig.DefaultCacheBehavior.TargetOriginId" --output text)"
          ORIGIN="$(aws cloudfront get-distribution --id "${DIST_ID}" --query "Distribution.DistributionConfig.Origins.Items[?Id=='${TARGET}'].DomainName | [0]" --output text)"
          if [[ -z "${ORIGIN}" || "${ORIGIN}" == "None" || "${ORIGIN}" != *.s3.*amazonaws.com ]]; then
            echo "default origin ${TARGET} is not an S3 bucket (${ORIGIN})"
            exit 1
          fi
          BUCKET="${ORIGIN%%.*}"
          echo "distribution=${DIST_ID} bucket=${BUCKET}"
          aws s3api head-bucket --bucket "${BUCKET}"
          # Delete removed keys first. cp below sets Cache-Control from cache_metadata()
          # even when the bytes did not change. Do not sync again after these copies.
          aws s3 sync olympus/ "s3://${BUCKET}/" --delete --exclude README.md
          manifest="$(python3 scripts/stamp-olympus-assets.py olympus --print-cache-manifest)"
          while IFS=$'\t' read -r rel cache ctype; do
            [[ -n "$rel" ]] || continue
            aws s3 cp "olympus/${rel}" "s3://${BUCKET}/${rel}" \
              --cache-control "$cache" \
              --content-type "$ctype"
          done <<< "$manifest"
          # Place A is olympus/cursor/index.html. Copy an extensionless key so /cursor resolves
          # on the S3 origin (default root object does not cover subpaths). Same HTML headers.
          meta="$(python3 scripts/stamp-olympus-assets.py --cache-metadata cursor/index.html)"
          cache="${meta%%$'\t'*}"
          ctype="${meta#*$'\t'}"
          aws s3 cp olympus/cursor/index.html "s3://${BUCKET}/cursor" \
            --content-type "$ctype" \
            --cache-control "$cache"
          # /* covers HTML documents and the directory index.
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/*"
