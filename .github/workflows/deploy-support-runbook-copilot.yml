name: Deploy support-runbook-copilot

on:
  push:
    branches: [main]
    paths:
      - 'agents/support-runbook-copilot/**'
      - '.github/workflows/deploy-support-runbook-copilot.yml'
  workflow_dispatch:

env:
  ECR_REPOSITORY: support-runbook-copilot
  SERVICE_NAME: support-runbook-copilot
  K8S_NAMESPACE: dev
  AGENT_DIR: agents/support-runbook-copilot

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint and import check
        working-directory: ${{ env.AGENT_DIR }}
        run: |
          pip install -r requirements.txt ruff==0.17.0
          ruff check .
          python -c "from app.main import app"

  build-and-push:
    name: Build & Push to ECR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Region and cluster come from platform-infra.dev.json (TF output SSOT).
      - name: Resolve platform config
        run: |
          python3 - <<'PY'
          import json, os, sys
          data = json.load(open("platform-infra.dev.json", encoding="utf-8"))
          missing = [k for k in ("aws_region", "cluster_name") if not data.get(k)]
          if missing:
              print(f"::error::platform-infra.dev.json missing {missing}")
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"AWS_REGION={data['aws_region']}\n")
              env.write(f"EKS_CLUSTER_NAME={data['cluster_name']}\n")
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-ecr
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build, tag & push
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          AGENT_DIR: ${{ env.AGENT_DIR }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "./$AGENT_DIR"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Region and cluster come from platform-infra.dev.json (TF output SSOT).
      - name: Resolve platform config
        run: |
          python3 - <<'PY'
          import json, os, sys
          data = json.load(open("platform-infra.dev.json", encoding="utf-8"))
          missing = [k for k in ("aws_region", "cluster_name") if not data.get(k)]
          if missing:
              print(f"::error::platform-infra.dev.json missing {missing}")
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"AWS_REGION={data['aws_region']}\n")
              env.write(f"EKS_CLUSTER_NAME={data['cluster_name']}\n")
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-eks
      - uses: azure/setup-kubectl@v3
      - name: Update kubeconfig
        env:
          CLUSTER: ${{ env.EKS_CLUSTER_NAME }}
          REGION: ${{ env.AWS_REGION }}
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION"
      # Asleep cluster fails this job, same outcome as LevKesha/cicd reusable-helm-deploy.yml.
      # Soft-downed EKS still answers the API with 0 Ready nodes.
      - name: Count Ready nodes
        id: nodes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ready="$(kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | awk '$0=="True"{n++} END{print n+0}')"
          echo "Ready nodes: ${ready}"
          if [ "${ready}" -eq 0 ] && [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::warning::cluster asleep (0 nodes) - dry-run skipped; manifests not validated"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "${ready}" -eq 0 ]; then
            echo "::error::cluster asleep (0 nodes) - manifests not applied; wake first (infrastructure wake-sleep-dev.yml action=wake) and rerun the deploy"
            echo "cluster asleep (0 nodes) - manifests not applied; wake first (infrastructure wake-sleep-dev.yml action=wake) and rerun the deploy" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply manifests
        if: steps.nodes.outputs.deploy == 'true'
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          AGENT_DIR: ${{ env.AGENT_DIR }}
        run: |
          set -euo pipefail
          sed "s/IMAGE_TAG/${IMAGE_TAG}/g" "$AGENT_DIR/k8s/deployment.yaml" | kubectl apply -f -
          kubectl apply -f "$AGENT_DIR/k8s/service.yaml"
      - name: Wait for rollout
        if: steps.nodes.outputs.deploy == 'true'
        env:
          SERVICE: ${{ env.SERVICE_NAME }}
          NAMESPACE: ${{ env.K8S_NAMESPACE }}
        run: kubectl rollout status deployment/"$SERVICE" -n "$NAMESPACE" --timeout=120s
