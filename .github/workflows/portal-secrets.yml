name: Portal secrets

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  portal-secrets:
    name: Olympus secret chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan olympus for secret assignments
        run: python3 scripts/check-portal-secrets.py
